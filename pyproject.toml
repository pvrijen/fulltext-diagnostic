[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fulltext-diagnostic"
version = "0.1.0"
description = "Diagnose whether full-text processing helps biomedical screening, and transfer knowledge via Privileged Features Distillation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Paul van Rijen", email = "paul.vanrijen@hesge.ch"},
    {name = "Julien Knafou"},
    {name = "Anaïs Mottaz"},
    {name = "Julien Gobeill"},
    {name = "Esteban Gaillac"},
    {name = "Patrick Ruch", email = "patrick.ruch@hesge.ch"},
]
maintainers = [
    {name = "Paul van Rijen", email = "paul.vanrijen@hesge.ch"},
]
keywords = ["biocuration", "screening", "knowledge-distillation", "full-text", "NLP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "click>=8.0",
    "rich>=13.0",
    "textual>=0.50",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]
experiments = [
    "umap-learn>=0.5",
    "matplotlib>=3.7",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
]

[project.scripts]
fulltext-diagnostic = "fulltext_diagnostic.cli:main"
ftd-monitor = "fulltext_diagnostic.tui:run"

[project.urls]
Homepage = "https://github.com/pvrijen/fulltext-diagnostic"
Issues = "https://github.com/pvrijen/fulltext-diagnostic/issues"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["fulltext_diagnostic*", "belt_plus*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F841"]
