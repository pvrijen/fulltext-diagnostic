[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fulltext-diagnostic"
version = "0.1.0"
description = "Diagnose whether full-text processing helps biomedical screening, and transfer knowledge via Privileged Features Distillation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Paul van Rijen", email = "paul.vanrijen@hesge.ch"},
    {name = "Patrick Ruch", email = "patrick.ruch@hesge.ch"},
]
keywords = ["biocuration", "screening", "knowledge-distillation", "full-text", "NLP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "click>=8.0",
    "rich>=13.0",
    "textual>=0.50",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
fulltext-diagnostic = "fulltext_diagnostic.cli:main"
ftd-monitor = "fulltext_diagnostic.tui:run"

[project.urls]
Homepage = "https://github.com/pvrijen/fulltext-diagnostic"
Paper = "https://github.com/pvrijen/fulltext-diagnostic"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["fulltext_diagnostic*", "belt_plus*"]
